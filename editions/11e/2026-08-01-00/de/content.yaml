# WH40K 11. Edition Cheatsheet - Inhalt für templates/cheatsheet.html.j2
# Übersetzt aus wh40k_11e_cheat_sheet_v1.pdf.
document:
  title: "Warhammer 40.000 - Cheatsheet 11. Edition"
  edition: "11e"
  revision: "2026-08-01-00"
  language: "de"
  i18n:
    page: "Seite"
    timing_your: "DEIN ZUG"
    timing_opponent: "ZUG DES GEGNERS"
    timing_either: "ZUG BEIDER SPIELER"
    label_when: "WANN"
    label_target: "ZIEL"
    label_effect: "EFFEKT"
    label_restrictions: "EINSCHRÄNKUNGEN"
  blocks:
    # ================= SEITE 1 =================
    - type: phase
      title: "1. BEFEHLSPHASE (08)"

    - type: subsection
      title: "Fähigkeiten zu Beginn der Phase (08.01)"
    - type: paragraph
      text: "Regeln, die zu Beginn der Befehlsphase ausgelöst werden, werden jetzt abgehandelt."

    - type: subsection
      title: "BP erhalten (08.02)"
    - type: paragraph
      text: "Beide Spieler erhalten 1 Befehlspunkt (BP) wenn er nicht mehr als 10 BP hat. BP werden nicht über 10 hinaus erhalten."

    - type: subsection
      title: "Erschütterungstest (08.03 / 01.07)"
    - type: paragraph
      html: "<b>Führe einen Wurf für jede Einheit durch, die:</b>"
    - type: list
      items:
        - "aktuell erschüttert ist, ODER"
        - "auf oder unter halber Stärke ist (verbleibende Modelle oder Lebenspunkte)"
    - type: paragraph
      html: "<b>Wirf 2W6 ≥ MW</b>, um zu bestehen. Bei Misserfolg ist die Einheit erschüttert:"
    - type: list
      items:
        - "MK-Wert wird zu '-'"
        - "Kann nicht von Gefechtsoptionen anvisiert werden"
        - "Kann keine Aktionen beginnen oder abschließen"

    - type: subsection
      title: "Befehlsfähigkeiten (08.04)"
    - type: list
      items:
        - "Andere Regeln der Befehlsphase abhandeln (Fraktionsfähigkeiten usw.)."

    - type: subsection
      title: "Fähigkeiten am Ende der Phase (08.05)"
    - type: paragraph
      text: "Regeln, die am Ende der Befehlsphase ausgelöst werden, werden jetzt abgehandelt."

    - type: phase
      title: "2. BEWEGUNGSPHASE (09)"

    - type: subsection
      title: "Bewegungsarten (09.02)"
    - type: list
      items:
        - html: "<b>Normale Bewegung (B):</b> Einheit darf nicht im Nahkampf sein. (09.05)"
        - html: "<b>Vorrücken (B+W6):</b> Einheit darf nicht im Nahkampf sein. Kann diesen Zug keinen Angriff ansagen oder eine Aktion beginnen. Darf sich nach vorrücken nicht im Nahkampf befinden. (09.06)"
        - html: "<b>Rückzug (B):</b> Einheit muss im Nahkampf sein. Kann diesen Zug nicht schießen, angreifen oder eine Aktion beginnen. Darf sich nach dem Rückzug nicht mehr im Nahkampf befinden. (09.07)"
          sub:
            - "Geordneter Rückzug: nur verfügbar, wenn die Einheit nicht erschüttert ist"
            - "Verzweifelte Flucht: verpflichtend, wenn erschüttert; Risikowurf pro Modell (06.03), Bewegung durch feindliche Modelle"
        - html: "<b>Stationär bleiben:</b> Jede Einheit. (09.04)"
    - type: callout
      variant: "warn"
      text: 'Nahkampfreichweite beträgt 2" horizontal + 5" vertikal (03.04)'
    - type: callout
      variant: "warn"
      text: 'Kohärenz: innerhalb 2" von ≥1 anderen Modell UND innerhalb 9" horizontal und 5" vertikal von jedem anderen Modell der Einheit (am Ende des Zuges prüfen) (03.03)'

    - type: subsection
      title: "Fliegen & Ansturm"
    - type: list
      items:
        - "Ansturmbewegung wird ausgelöst, wenn die Einheit nicht erschüttert und nicht im Nahkampf ist und sich diese Phase nicht bewegt hat. Muss sich zum nächsten Gegner bewegen. (21.02)"
        - 'Kündige "In den Himmel aufschwingen" vor der Bewegung an. -2" von der Maximaldistanz. Kann sich durch alle Modelle und Gelände bewegen. (21.03)'

    - type: subsection
      title: "Einsteigen (18.02)"
    - type: list
      items:
        - "Nach einer normalen Bewegung, einem Vorrücken oder einem Rückzug."
        - 'Alle Modelle müssen sich innerhalb von 3" des Transporters befinden; Einheit wird diesen Zug nicht aufgestellt; ausreichende Kapazität.'

    - type: subsection
      title: "Aussteigen (18.03)"
    - type: paragraph
      html: '<b>Schnell (Aufstellung innerhalb 3"):</b> Transporter hat eine normale Bewegung oder Einsatzbewegung gemacht. Kann diesen Zug keinen Angriff ansagen. (18.04)'
    - type: paragraph
      html: '<b>Taktisch (Aufstellung innerhalb 3"):</b> Transporter steht still oder hat sich noch nicht bewegt. Einheit macht dann eine normale Bewegung oder ein Vorrücken. (18.04)'
    - type: paragraph
      html: '<b>Kampf (Aufstellung innerhalb 6"):</b> Andernfalls. Risikowurf pro Modell. Erschüttert; kann nicht angreifen. (18.04)'
    - type: paragraph
      html: '<b>Notausstieg (Transporter zerstört):</b> Risikowurf pro Modell. Vollständig innerhalb 6" aufstellen. Erschüttert; kann nicht angreifen. (18.05)'

    - type: subsection
      title: "Strategische Reserven / Einsatzbewegung"
    - type: list
      items:
        - "Max. 50 % der Punkte. Treffen ab Schlachtrunde 2 ein. (20.03)"
        - 'Vollständig innerhalb 6" einer Spielfeldkante aufstellen, mehr als 8" horizontal von allen Gegnern entfernt.'
        - "Vor Runde 3: keine Aufstellung in der Aufstellungszone des Gegners."
    - type: callout
      variant: "warn"
      text: "Nach einer Einsatzbewegung kann die Einheit bis zum Beginn der nächsten Angriffsphase keine weitere Bewegung machen."
    - type: list
      items:
        - "Nicht bis zum Ende von Schlachtrunde 3 eingetroffen = zerstört (außer Einheiten in eingetroffenen Transportern und neu positionierte Einheiten)."

    - type: phase
      title: "3. FERNKAMPFPHASE (10)"

    - type: subsection
      title: "Schussarten (10.02)"
    - type: paragraph
      html: "<b>Normal:</b> nicht im Nahkampf, nicht vorgerückt. (10.04)"
    - type: paragraph
      html: "<b>Sturm:</b> nicht im Nahkampf, vorgerückt, hat [STURM]-Waffen. Nur [STURM]-Waffen dürfen verwendet werden. (10.05)"
    - type: paragraph
      html: "<b>Nahbeschuss:</b> Im Nahkampf, nicht vorgerückt, hat min. eine [NAHBEREICH]-Waffe oder ist MONSTER / FAHRZEUG. (10.06)"
    - type: list
      items:
        - "Nicht-MONSTER / FAHRZEUG: nur [NAHBEREICH]-Waffen; muss eine im Nahkampf befindliche feindliche Einheit anvisieren."
        - "MONSTER / FAHRZEUG: -1 auf Treffer, außer bei einer [NAHBEREICH]-Waffe gegen ein im Nahkampf befindliches Ziel. [EXPLOSIV]-Waffen können im Nahkampf befindliche Einheiten nicht anvisieren."
    - type: paragraph
      html: "<b>Indirekt:</b> Nicht im Nahkampf, nicht vorgerückt, hat min. ein [INDIREKTES FEUER]. (10.07)"

    - type: subsection
      title: "Zielregeln"
    - type: list
      items:
        - "<b>Normal/Sturm</b>: Ziel sichtbar, in Reichweite, nicht im Nahkampf."
        - "<b>Indirekt</b>: Ziel muss nicht sichtbar sein; Ziel hat Deckungsvorteil; Treffer können nicht wiederholt werden; unmodifizierte 1-5 verfehlen (1-3, wenn die Einheit stehen geblieben und das Ziel für eine verbündete Einheit sichtbar ist)."
        - "Im Nahkampf befindliche MONSTER- / FAHRZEUG-Einheiten können anvisiert werden; -1 auf Treffer."
        - "Verschiedene Waffen desselben Modells dürfen unterschiedliche Einheiten anvisieren; eine Waffe kann nicht auf mehrere Ziele aufgeteilt werden."

    - type: subsection
      title: "Attackenablauf"
    - type: keyvals
      items:
        - label: "1. Trefferwurf (05.01)"
          text: "W6 ≥ BF/KG. Unmodifizierte 1 verfehlt immer, unmodifizierte 6 ist ein Kritischer Treffer."
        - label: "2. Verwundungswurf (05.02)"
          text: "W6 gegen Tabelle. Unmodifizierte 1 verfehlt immer, unmodifizierte 6 ist eine Kritische Verwundung."
    - type: table
      columns: ["Stärke vs Widerstand", "Nötiger Wurf"]
      rows:
        - ["S ≥ 2xW", "2+"]
        - ["S > W", "3+"]
        - ["S = W", "4+"]
        - ["S < W", "5+"]
        - ["S ≤ ½W", "6+"]
    - type: keyvals
      items:
        - label: "3. Verwundungen zuteilen (siehe unten)"
          text:
        - label: "4. Rettungswurf (RE) und Rüstungswurf (RW) (05.04)"
          text: "W6 gegen RE oder W6 - DS gegen RW. Unmodifizierte 1 fügt immer Schaden zu."
        - label: "5. Schaden (05.04)"
          text: "Modell verliert Lebenspunkte = SW. Überschüssiger Schaden verfällt."

    - type: subsection
      title: "Verwundungen zuteilen (05.03)"
    - type: paragraph
      html: "<b>Gruppen:</b> Eine pro CHARAKTER; eine pro übereinstimmendem Satz LP/RW/unverw. RW der Nicht-CHARAKTERE."
    - type: paragraph
      html: "<b>Reihenfolge:</b> Verwundeter Nicht-CHARAKTER → unverwundeter Nicht-CHARAKTER → CHARAKTER (zuletzt)."
    - type: callout
      variant: "warn"
      text: "Keine CHARAKTER-Gruppe darf vor einer Nicht-CHARAKTER-Gruppe zugewiesen werden. Sind alle Nicht-CHARAKTERE ausgeschaltet, treffen Wunden CHARAKTERE normal (keine pauschale Immunität)."
    - type: callout
      variant: "warn"
      text: "Rettungswürfe von niedrig nach hoch abarbeiten. Innerhalb einer Gruppe zuerst das Modell mit verlorenen Lebenspunkten wählen."

    - type: subsection
      title: "Deckungsvorteil (13.08)"
    - type: list
      items:
        - html: "Verschlechtere die BF des Angreifers um 1, wenn <b>jedes</b> Modell der Zieleinheit INFANTERIE / BESTIEN / SCHWARM innerhalb eines Geländestücks ist ODER durch dazwischenliegendes Gelände/verdeckende Fläche nicht vollständig sichtbar ist."

    - type: subsection
      title: "Tödliche Wunden (TW) (06.02)"
    - type: list
      items:
        - "1 TW = 1 verlorener Lebenspunkt, keine Rettungswürfe. Wird nach dem gesamten normalen Schaden derselben Attacke zugefügt (siehe Verwundungen zuteilen). Verletzungen ignorieren-Würfe können weiterhin gemacht werden."

    - type: subsection
      title: "Risikowürfe (06.03)"
    - type: list
      items:
        - "Wirf einen W6: 1-2 erleidet 1 TW (oder 3 TW bei MONSTER / FAHRZEUG)"

    # ================= SEITE 2 =================
    - type: subsection
      title: "Missionsziele"
    - type: list
      items:
        - "Geländemissionsziel: Missionsziel = das Geländestück selbst; in Reichweite = vollständig innerhalb dieser Fläche."
        - 'Missionszielmarker: in Reichweite = innerhalb 3" horizontal und 5" vertikal.'
        - "Kontrollstufe: addierter MK-Wert aller eigenen Modelle in Reichweite."
        - "Höhere Kontrolle gewinnt; gleiche Kontrolle = umkämpft. Wird am Ende jeder Phase und jedes Zuges bestimmt."
        - "<b>Gesichertes Missionsziel:</b> bleibt kontrolliert, auch ohne Modelle in Reichweite, bis die Kontrolle des Gegners deine am Ende einer Phase übersteigt."

    - type: subphase
      title: "AKTIONEN"
    - type: paragraph
      html: "<b>Eine Einheit kann keine Aktion beginnen, wenn sie: (16.01)</b>"
    - type: list
      items:
        - "nicht auf dem Schlachtfeld ist."
        - "eine FLUGZEUG- oder FESTUNG-Einheit ist."
        - "erschüttert ist."
        - "MK-Wert = 0 oder - hat."
        - "im Nahkampf ist (außer TITANISCH)."
        - "diesen Zug vorgerückt ist oder einen Rückzug gemacht hat."
        - "diesen Zug bereits eine andere Aktion begonnen hat."
    - type: paragraph
      html: "<b>Eine Aktion beginnen:</b> Einheit ist nicht berechtigt zu schießen (außer TITANISCH) oder einen Angriff anzusagen, bis die Aktion oder der Zug endet."
    - type: paragraph
      html: "<b>Scheitert, wenn:</b> die Einheit sich bewegt (außer Nachrücken/Konsolidierung) oder das Schlachtfeld verlässt."

    - type: subphase
      title: "GELÄNDE"
    - type: subsection
      title: "Bewegung nach Kategorie (13.06)"
    - type: paragraph
      html: "<b>Exponiert (13.03) &amp; Leicht (13.04):</b> Alle Modelle können sich frei horizontal und vertikal durch dieses Gelände bewegen."
    - type: paragraph
      html: "<b>Dicht (13.05):</b>"
    - type: list
      items:
        - "INFANTERIE / BESTIEN / SCHWARM / MOBIL können sich horizontal frei bewegen"
        - "INFANTERIE / BESTIEN / SCHWARM können sich vertikal frei bewegen"
        - 'Alle anderen bewegen sich horizontal nur durch Abschnitte ≤ 2" Höhe; klettern vertikal durch höhere Abschnitte.'
        - "Können nicht auf erhöhter Fläche enden, außer alle Modelle sind INFANTERIE / BESTIEN / SCHWARM / FLIEGT / MONSTER und kein Teil der Base ragt über die Außenkante hinaus."
    - type: subsection
      title: "Sichtbarkeit (13.07)"
    - type: paragraph
      html: '<b>Fest (dichtes Gelände):</b> Sichtlinie kann geschlossene Lücken ≤ 3" über dem Boden nicht durchqueren. (13.11)'
    - type: paragraph
      html: "<b>Versperrte Sicht:</b> Wenn jede Sichtlinie zwischen zwei Modellen eine verdeckende Fläche durchquert (kein Modell darin), können sie sich nicht sehen. (13.10)"
    - type: paragraph
      html: '<b>Versteckt:</b> INFANTERIE / BESTIEN / SCHWARM in einer dichten Fläche, keine Fernkampfattacken diesen Zug. Nur innerhalb 15" sichtbar. (13.09)'
    - type: paragraph
      html: '<b>Erhöhter Beschuss:</b> +1 BF, wenn der Angreifer auf Gelände ≥ 3" Höhe steht oder AUFRAGEND hat und das Ziel innerhalb 12" ist. (22.05)'

    - type: phase
      title: "4. ANGRIFFSPHASE (11)"
    - type: paragraph
      html: 'Ziele müssen innerhalb 12" sein (müssen nicht sichtbar sein) und nicht im Nahkampf befindlich. (11.02)'
    - type: paragraph
      html: "<b>Angriffswurf:</b> 2W6 = maximale Distanz der Angriffsbewegung. (11.02)"
    - type: paragraph
      html: "<b>Bedingungen der Angriffsbewegung: (11.02)</b>"
    - type: list
      items:
        - "Angriffsziele vor der Bewegung wählen."
        - 'Jedes Modell muss sich näher zu einem Angriffsziel bewegen; wenn möglich innerhalb 1"; wenn möglich im Nahkampf.'
        - "Muss mit <b>allen</b> Angriffszielen im Nahkampf enden; darf nicht mit Nicht-Zielen im Nahkampf enden."
        - "Jedes Modell der angreifenden Einheit erhält ERSTSCHLAG."

    - type: phase
      title: "5. NAHKAMPFPHASE (12)"
    - type: subsection
      title: "Nachrücken - <u>beide</u> Spieler; aktiver Spieler zuerst (12.03)"
    - type: list
      items:
        - 'Bis zu 3", wenn im Nahkampf ODER eine Angriffsbewegung gemacht ODER für einen Überrennen-Nahkampf gewählt. (12.06)'
        - 'Zuerst Ziele wählen: jede im Nahkampf befindliche feindliche Einheit (falls im Nahkampf); oder min. eine Einheit innerhalb 5" (falls nicht).'
        - "Modelle in Basekontakt können sich nicht bewegen. Jedes bewegte Modell muss näher zum nächsten Ziel enden, im Nahkampf wenn möglich."
        - "Muss im Nahkampf enden. Jedes Modell, das im Nahkampf begonnen hat, muss im Nahkampf bleiben."
    - type: subsection
      title: "Kampf - <u>beide</u> Spieler; aktiver Spieler zuerst (12.04)"
    - type: paragraph
      html: "<b>Berechtigt:</b> Zu Beginn des Kampfschritts im Nahkampf oder Angriffsbewegung gemacht."
    - type: paragraph
      html: "<b>1. Erstschlag:</b> Abwechselnd wählen, aktiver Spieler beginnt."
    - type: paragraph
      html: "<b>2. Übrige Kämpfe:</b> Beginne mit dem Spieler, der diesen Ablauf zu diesem Schritt gebracht hat, abwechselnd wählen."
    - type: paragraph
      html: "<b>Kampfarten:</b>"
    - type: list
      items:
        - html: "<b>Normaler Kampf:</b> Einheit ist im Nahkampf. (12.05)"
        - html: "<b>Überrennen-Nahkampf:</b> Einheit ist nicht im Nahkampf (oder war es zu Beginn des Schritts). Eine zusätzliche Nachrücken-Bewegung, dann kämpft sie. (12.06)"
    - type: paragraph
      text: 'Wird ein neues "Kämpft zuerst" während der Abhandlung der Übrigen Kämpfe berechtigt, kehre zum Schritt "Kämpft zuerst" zurück. Sind alle berechtigten Einheiten mehr als 5" von allen feindlichen Einheiten entfernt, darf der Spieler passen.'
    - type: subsection
      title: "Neu ordnen - <u>beide</u> Spieler; aktiver Spieler zuerst (12.08)"
    - type: list
      items:
        - 'Bis zu 3", wenn die Einheit diese Phase kampfberechtigt war.'
    - type: paragraph
      html: "<b>Modus wählen (erster zutreffender):</b>"
    - type: list
      items:
        - html: "<b>Laufend:</b> Einheit im Nahkampf, bleibt im Nahkampf; bewege dich näher zu Gegnern, bewege <u>nicht</u> bei Basekontakt."
        - html: '<b>Offensiv:</b> Innerhalb 3" von Gegnern. Muss falls möglich im Nahkampf enden; neu im Nahkampf befindliche, feindliche Einheiten, die noch nicht gekämpft haben, müssen als Nächstes kämpfen.'
        - html: '<b>Missionsziel:</b> Innerhalb 3" eines Missionsziels. Muss falls möglich in dessen Reichweite enden.'

    # ---- Kernfähigkeiten (Glossar, volle Breite) ----
    - type: page_break
    - type: column_reset
    - type: glossary
      title: "KERNFÄHIGKEITEN"
      spanning: yes
      terms:
        - {
            term: "[ANTI-X Y+] (24.03)",
            text: "Unmodifizierter Verwundungswurf von Y+ = Kritische Verwundung gegen Schlüsselwort X.",
          }
        - { term: "[STURM] (24.04)", text: "Ermöglicht Sturmbeschuss." }
        - {
            term: "[EXPLOSIV X] (24.05)",
            text: "+X Attackenwürfel pro 5 Modelle in der Zieleinheit (abrunden). X=1 wenn X fehlt.",
          }
        - {
            term: "[SPALTEN X] (24.06)",
            text: "+X Attackenwürfel pro 5 Modelle in der Zieleinheit (abrunden).",
          }
        - {
            term: "[NAHBEREICH] (24.07)",
            text: "Ermöglicht Nahbereichbeschuss, alt: [PISTOLE].",
          }
        - {
            term: "GEFÄHRLICHES ENDE X (24.08)",
            text: 'Bei Zerstörung W6 werfen; bei 6 erleiden Einheiten innerhalb 6" X TW (bei zufälligem X pro Einheit werfen).',
          }
        - {
            term: "SCHOCKTRUPPEN (24.09)",
            html: 'Einsatzbewegung kann überall &gt; 8" von Gegnern erfolgen, auch in der Aufstellungszone des Gegners.',
          }
        - {
            term: "[VERHEERENDE VERWUNDUNGEN] (24.10)",
            html: "Kritische Verwundung → Attacke endet; Ziel erleidet TW = SW-Wert. Max. 1 Modell pro Kritischer Verwundung; überschüssige TW verfallen.",
          }
        - {
            term: "[ZUSATZATTACKEN] (24.11)",
            text: "Im Kampf: müssen alle [ZUSATZATTACKEN]-Waffen plus eine weitere Nahkampfwaffe verwenden.",
          }
        - {
            term: "VERLETZUNGEN IGNORIEREN X+ (24.12)",
            text: "Jedes Mal, wenn ein Modell einen Lebenspunkt verlieren würde (auch TW), W6 werfen; bei X+ geht der Lebenspunkt nicht verloren.",
          }
        - {
            term: "ERSTSCHLAG (24.13)",
            text: 'Jedes Modell muss dies haben; Einheit kämpft im Schritt "Erstschlag".',
          }
        - {
            term: "FEUERPLATFORM X (24.14)",
            text: "Bis zu X eingestiegene Modelle wählen; TRANSPORTER erhält diese Phase deren Fernkampfwaffen. Diese Einheiten können nicht schießen.",
          }
        - {
            term: "[RISKANT] (24.15)",
            text: "Ein Risikowurf pro verwendeter [RISKANT]-Waffe.",
          }
        - {
            term: "SCHWER (24.16)",
            text: '+1 auf Treffer, wenn nicht im Nahkampf UND diesen Zug nicht aufgestellt UND ≤ 3" bewegt.',
          }
        - {
            term: "SCHWEBER (24.17)",
            text: 'In die Himmel aufschwingen: ziehe nicht 2" von der Maximaldistanz ab.',
          }
        - {
            term: "[DECKUNG IGNORIEREN] (24.18)",
            text: "Ziel kann gegen diese Attacke keinen Deckungsvorteil haben.",
          }
        - {
            term: "[INDIREKTES FEUER] (24.19)",
            text: "Ermöglicht indirektes Schießen.",
          }
        - {
            term: "INFILTRATOREN (24.20)",
            html: 'Aufstellung &gt; 8" von der Aufstellungszone des Gegners und allen Gegnern entfernt.',
          }
        - {
            term: "[LANZE] (24.21)",
            text: "+1 auf Verwundung, wenn die Einheit diesen Zug eine Angriffsbewegung gemacht hat.",
          }
        - {
            term: "ANFÜHRER / UNTERSTÜTZUNG (24.22)",
            text: "Anführer und Unterstützung schließen sich je einer Leibwächtereinheit an (max. ein Anführer + eine Unterstützung pro Leibwächter). W des Leibwächters wird für Verwundungswürfe genutzt. Siehe Wundzuweisung für CHARAKTER-Schutzregeln.",
          }
        - {
            term: "[TÖDLICHE TREFFER] (24.23)",
            html: "Kritischer Treffer → darf automatisch verwunden (kein Verwundungswurf; kann keine Kritische Verwundung ergeben).",
          }
        - {
            term: "EINSAMER WOLF (24.24)",
            text: 'Jenseits von 12" nicht sichtbar. Kann jenseits von 12" nicht durch [INDIREKTES FEUER] anvisiert werden.',
          }
        - {
            term: "[MELTER X] (24.25)",
            text: 'Wenn das Ziel bei "Ziele wählen" innerhalb halber Reichweite ist, addiere X zu SW.',
          }
        - {
            term: "[EINMALIG EINSETZBAR] (24.26)",
            text: "Einmal pro Schlacht. Wiederbelebte Modelle können es nicht erneut nutzen.",
          }
        - {
            term: "[PISTOLE] (24.27)",
            text: "[PISTOLE] und [NAHBEREICH] sind für alle Regelbelange identisch. Siehe [NAHBEREICH].",
          }
        - {
            term: "[PRÄZISION] (24.28)",
            text: "Darf eine sichtbare CHARAKTER-Zuweisungsgruppe als aktuelle Zuweisungsgruppe wählen.",
          }
        - {
            term: "[PSIONISCH] (24.29)",
            text: "Darf Modifikatoren auf BF/KG und Trefferwurf ignorieren. Zählt als psionische Attacke.",
          }
        - {
            term: "[SCHNELLFEUER X] (24.30)",
            text: "+X Attackenwürfel, wenn das Ziel bei der Auswahl innerhalb halber Reichweite ist.",
          }
        - {
            term: "KUNDSCHAFTER X (24.31)",
            html: 'Vor der Schlacht: Kundschafterbewegung (24.32) bis zu X" (muss &gt;8" von Gegnern enden) ODER aus der Reserve in die Aufstellungszone verlegen.',
          }
        - {
            term: "TARNUNG (24.33)",
            text: "Wenn jedes Modell dies hat: Einheit hat Deckungsvorteil gegen alle Fernkampfattacken.",
          }
        - {
            term: "UNTERSTÜTZUNG (24.34)",
            text: "Siehe Angeschlossene Einheiten. Kann nur eine Unterstützungseinheit haben.",
          }
        - {
            term: "ÜBERSCHWERER LÄUFER (24.35)",
            text: 'Bewegt sich durch Modelle (nicht TITANISCH); horizontal durch Gelände ≤ 4" Höhe. Kann MOBIL für die Bewegung gewähren (bei 1 nach Ende der Bewegung: erschüttert).',
          }
        - {
            term: "[TREFFERHAGEL] X (24.36)",
            text: "Kritischer Treffer = X zusätzliche Treffer.",
          }
        - { term: "[SCHWALL] (24.37)", text: "Trifft automatisch." }
        - {
            term: "[SYNCHRONISIERT] (24.38)",
            text: "Verwundungswurf wiederholen.",
          }

    - type: glossary
      title: "DATENBLATT-KENNWERTE"
      spanning: yes
      terms:
        - {
            term: "B",
            text: "Bewegung - Distanz, die die Einheit bewegen kann (Normale Bewegung/Vorrücken).",
          }
        - {
            term: "W",
            text: "Widerstand - wird im Verwundungswurf verwendet (S vs W).",
          }
        - {
            term: "RW / RE",
            text: "Rüstungswurf - Rettungswurf-Kennwert, wird im Rettungswurf-Schritt verwendet. Ein unverwundbarer Rettungswurf (RE) funktioniert genauso, ignoriert aber DS.",
          }
        - {
            term: "LP",
            text: "Lebenspunkte - wie viele Lebenspunkte das Modell hat.",
          }
        - {
            term: "MW",
            text: "Moralwert - Zielwert für den Erschütterungstest.",
          }
        - {
            term: "MK",
            text: "Missionszielkontrolle - Beitrag zur Kontrolle eines Missionsziels.",
          }
        - {
            term: "R",
            text: "Reichweite - maximale Distanz, auf die eine Waffe zielen kann.",
          }
        - {
            term: "A",
            text: "Attacken - Anzahl der Attacken, die eine Waffe erzeugt.",
          }
        - {
            term: "BF",
            text: "Ballistische Fähigkeit - Trefferwurf-Kennwert für Fernkampfattacken.",
          }
        - {
            term: "KG",
            text: "Kampfgeschick - Trefferwurf-Kennwert für Nahkampfattacken.",
          }
        - {
            term: "S",
            text: "Stärke - wird im Verwundungswurf verwendet (S vs W).",
          }
        - {
            term: "DS",
            text: "Durchschlagsstärke - verschlechtert den Rettungswurf des Ziels.",
          }
        - {
            term: "SW",
            text: "Schadenswert - Lebenspunkte, die das Ziel im Schadensschritt verliert.",
          }

    # ================= SEITE 3 - GEFECHTSOPTIONEN =================
    - type: page_break
    - type: spanning_headline
      title: "GEFECHTSOPTIONEN"

    - type: stratagem
      title: "Befehlswiederholungswurf (15.02)"
      cost: "1BP"
      timing: "either"
      when: "In jeder Phase, direkt nach einem Vorrück-, Angriffs-, Schadens-, Risiko-, Treffer-, Schutz- oder Verwundungswurf oder einem Wurf zur Bestimmung der Attackenanzahl einer Waffe, für eine verbündete Einheit oder ein Modell."
      target: "Diese Einheit oder dieses Modell."
      effect: "Wiederhole diesen Wurf. Werden mehrere Würfel zusammen geworfen, wähle einen Würfel zum Wiederholen. Angriffswürfe müssen vollständig wiederholt werden."

    - type: stratagem
      title: "Epische Herausforderung (15.03)"
      cost: "1BP"
      timing: "either"
      when: "Nahkampfphase, direkt nachdem eine verbündete CHARAKTER-Einheit zum Kämpfen gewählt wurde."
      target: "Diese CHARAKTER-Einheit."
      effect: "Wähle ein CHARAKTER-Modell in deiner Einheit. Bis zum Ende der Phase haben die Nahkampfwaffen dieses Modells [PRÄZISION]."

    - type: stratagem
      title: "Wahnsinniger Mut (15.04)"
      cost: "1BP"
      timing: "your"
      when: "Erschütterungsschritt deiner Befehlsphase, direkt vor einem Erschütterungswurf für eine verbündete Einheit."
      target: "Diese Einheit."
      effect: "Dieser Erschütterungswurf gelingt automatisch."
      restrictions: "Einmal pro Schlacht."

    - type: stratagem
      title: "Sprengsätze (15.05)"
      cost: "1BP"
      timing: "your"
      when: "Deine Fernkampfphase."
      target: "Eine verbündete, nicht im Nahkampf befindliche EXPLOSIV/GRANATEN-Einheit, die schießen darf und diesen Zug nicht vorgerückt ist."
      effect: 'Wähle ein EXPLOSIV/GRANATEN-Modell und eine nicht im Nachkampf befindliche, feindliche Einheit innerhalb 8" und für es sichtbar. Wirf sechs W6: für jede 4+ erleidet diese feindliche Einheit 1 tödliche Wunde.'

    - type: stratagem
      title: "Zerschmetternder Aufprall (15.06)"
      cost: "1BP"
      timing: "your"
      when: "Deine Angriffsphase, direkt nachdem eine verbündete MONSTER/FAHRZEUG-Einheit eine Angriffsbewegung beendet."
      target: "Diese MONSTER/FAHRZEUG-Einheit."
      effect: "Wähle eine im Nahkampf befindliche feindliche Einheit und ein damit im Nahkampf befindliches Modell deiner Einheit. Wirf so viele W6 wie der W-Wert dieses Modells: jede 1 = deine Einheit erleidet 1 TW; jede 5+ = Gegner erleidet 1 TW (max. 6 TW)."

    - type: stratagem
      title: "Schneller Einsatz (15.07)"
      cost: "1BP"
      timing: "opponent"
      when: "Ende der Bewegungsphase deines Gegners."
      target: "Eine verbündete Einheit in strategischer Reserve (außer FLUGZEUG)."
      effect: "Deine Einheit macht eine Landebewegung."
      restrictions: "Kann nicht während der ersten Schlachtrunde verwendet werden."

    - type: stratagem
      title: "Abwehrfeuer geben (15.08)"
      cost: "1BP"
      timing: "opponent"
      when: "Ende der Bewegungsphase deines Gegners."
      target: "Eine verbündete Einheit (außer TITANISCH) die sich nicht im Nahkampf befindet."
      effect: 'Deine Einheit nutzt Schnappschüsse - visiere eine sichtbare feindliche Einheit innerhalb 24" an; trifft nur bei unmodifizierter 6; Trefferwürfe können nicht wiederholt werden. Einheit kann bis zum Ende der Phase keine Aktion beginnen.'

    - type: stratagem
      title: "Rauchvorhang (15.10)"
      cost: "1BP"
      timing: "opponent"
      when: "Beginn der Schussphase deines Gegners."
      target: "Eine verbündete RAUCH-Einheit."
      effect: "Bis zum Ende der Phase hat jedes Ziel Deckungsvorteil, wenn eine Attacke deine RAUCH-Einheit anvisiert oder eine Einheit, die dem Angreifer wegen deiner RAUCH-Einheit nicht vollständig sichtbar ist."

    - type: stratagem
      title: "Heroische Intervention (15.11)"
      cost: "1BP / 2BP"
      timing: "opponent"
      when: "Ende der Angriffsphase deines Gegners."
      target: 'Eine verbündete, nicht im Nahkampf befindliche Einheit innerhalb 12" einer oder mehrerer feindlicher Einheiten. FAHRZEUG nur, wenn CHARAKTER/LÄUFER.'
      effect_html: 'Führe einen Angriff durch. Wähle den Modus vor dem Angriffswurf:<ul><li><b>Zu Hilfe eilen (1BP):</b> Angriffsziele müssen Einheiten sein, die diese Phase eine Angriffsbewegung gemacht haben und in Maximaldistanz sind.</li><li><b>Mitten im Kampf (2BP):</b> Angriffswurf-Ergebnis &gt;6 wird zu 6; Angriffsziele können beliebige Gegner innerhalb 6" und in Maximaldistanz sein.</li></ul>'

    - type: stratagem
      title: "Gegenoffensive"
      cost: "2BP"
      timing: "opponent"
      when: "Kampfschritt der Nahkampfphase deines Gegners, direkt nachdem eine feindliche Einheit ihre Attacken abgehandelt hat."
      target: "Eine verbündete Einheit, die kämpfen darf."
      effect: "Bis zum Ende der Phase hat deine Einheit Erstschlag und muss die nächste zum Kämpfen gewählte Einheit sein."

    - type: column_reset

    - type: spanning_headline
      title: "GEFECHTSOPTIONEN VERWENDEN"
    - type: list
      single_column: yes
      items:
        - "Zur Verwendung: Ziele wählen → BP um die Kosten der Gefechtsoption reduzieren → Effekt abhandeln. Nicht nutzbar bei unzureichenden BP."
        - "Dieselbe Gefechtsoption kann nicht mehr als einmal in derselben Phase verwendet werden."
        - "Sofern nicht anders angegeben, kann dieselbe Einheit nicht mit mehr als einer Gefechtsoption in derselben Phase anvisiert werden."
        - "Hat eine Gefechtsoption einen Zusatzkosten-Abschnitt (z. B. +1BP), kann sie nur durch Zahlung dieser Zusatzkosten verwendet werden."
