# WH40K 11th Edition Cheat Sheet - content for templates/cheatsheet.html.j2
# Transcribed from wh40k_11e_cheat_sheet_v1.pdf.
# Load this file and render:  template.render(**yaml.safe_load(open(...)))
document:
  title: "Warhammer 40,000 - 11th Edition Cheat Sheet"
  edition: "11e"
  revision: "2026-08-01-00"
  language: "en"
  blocks:
    # ================= PAGE 1 =================
    - type: phase
      title: "1. COMMAND PHASE (08)"

    - type: subsection
      title: "Start of Phase Abilities (08.01)"
    - type: paragraph
      text: "Rules triggered at start of the Command phase are resolved now."

    - type: subsection
      title: "Gain CP (08.02)"
    - type: paragraph
      text: "Both players gain 1 Command Point (CP) if they have 10 or fewer CP. CP cannot be gained beyond 10."

    - type: subsection
      title: "Battle-Shock Test (08.03 / 01.07)"
    - type: paragraph
      html: "<b>Make one roll for each unit that is:</b>"
    - type: list
      items:
        - "Currently battle-shocked, OR"
        - "At or below half-strength (models or wounds remaining)"
    - type: paragraph
      html: "<b>Roll 2D6 ≥ Ld</b> to pass. If failed, unit is battle-shocked:"
    - type: list
      items:
        - "OC characteristic becomes '-'"
        - "Cannot be targeted by stratagems"
        - "Cannot start or complete actions"

    - type: subsection
      title: "Command Abilities (08.04)"
    - type: list
      items:
        - "Resolve other Command phase rules (faction abilities, etc.)."

    - type: subsection
      title: "End of Phase Abilities (08.05)"
    - type: paragraph
      text: "Rules triggered at end of the Command phase are resolved now."

    - type: phase
      title: "2. MOVEMENT PHASE (09)"

    - type: subsection
      title: "Move Types (09.02)"
    - type: list
      items:
        - html: "<b>Normal Move (M):</b> Unit must be unengaged. (09.05)"
        - html: "<b>Advance (M+D6):</b> Unit must be unengaged. Cannot declare charge or start action this turn. Cannot be within Engagement Range of enemy units after advancing. (09.06)"
        - html: "<b>Fall-back (M):</b> Unit must be engaged. Cannot shoot, charge, or start action this turn. Cannot end the move engaged. (09.07)"
          sub:
            - "Ordered Retreat: only available if unit is not battle-shocked"
            - "Desperate Escape: mandatory if battle-shocked, Hazard roll per model (06.03), move through enemy models"
        - html: "<b>Remain Stationary:</b> Any unit. (09.04)"
    - type: callout
      variant: "warn"
      text: 'Engagement Range is 2" horizontal + 5" vertical (03.04)'
    - type: callout
      variant: "warn"
      text: 'Coherency: within 2" of ≥1 other model AND within 9" horizontal and 5" vertical of every other model in the unit (check at End of Turn) (03.03)'

    - type: subsection
      title: "Flying & Surging"
    - type: list
      items:
        - "Surge when triggered if not battle-shocked, unengaged, and has not moved this phase. Must move toward closest enemy. (21.02)"
        - 'Declare take to the skies before moving. -2" from max distance. Can move through all models and terrain. (21.03)'

    - type: subsection
      title: "Embarking (18.02)"
    - type: list
      items:
        - "After normal, advance, or fall-back move."
        - 'All models must be within 3" of the transport; unit not set up this turn; sufficient capacity.'

    - type: subsection
      title: "Disembarking (18.03)"
    - type: paragraph
      html: '<b>Rapid (set-up within 3"):</b> Transport made a normal or ingress move. Cannot declare charge this turn. (18.04)'
    - type: paragraph
      html: '<b>Tactical (set-up within 3"):</b> Transport stationary or not yet moved. Unit then makes a normal or advance move. (18.04)'
    - type: paragraph
      html: '<b>Combat (set-up within 6"):</b> Otherwise. Hazard roll per model. Battle-shocked; cannot charge. (18.04)'
    - type: paragraph
      html: '<b>Emergency (transport destroyed):</b> Hazard roll per model. Set up wholly within 6". Battle-shocked; cannot charge. (18.05)'

    - type: subsection
      title: "Strategic Reserves / Ingress Move"
    - type: list
      items:
        - "Max 50% of points. Arrive from battle round 2 onwards. (20.03)"
        - 'Set up wholly within 6" of a battlefield edge, more than 8" horizontally from all enemies.'
        - "Before round 3: cannot set up in opponent's deployment zone."
    - type: callout
      variant: "warn"
      text: "After an ingress move, unit cannot make any other move until the start of the next Charge phase."
    - type: list
      items:
        - "Not arrived by end of battle round 3 = destroyed (except units in arrived transports and repositioned units)."

    - type: phase
      title: "3. SHOOTING PHASE (10)"

    - type: subsection
      title: "Shooting Types (10.02)"
    - type: paragraph
      html: "<b>Normal:</b> Unengaged, did not advance. (10.04)"
    - type: paragraph
      html: "<b>Assault:</b> Unengaged, advanced, has [ASSAULT] weapons. Only [ASSAULT] weapons may be used. (10.05)"
    - type: paragraph
      html: "<b>Close-Quarters:</b> Engaged, did not advance, has at least one [CLOSE-QUARTERS] weapon or is MONSTER / VEHICLE. (10.06)"
    - type: list
      items:
        - "Non-MONSTER / VEHICLE: [CLOSE-QUARTERS] weapons only; must target an engaged enemy unit."
        - "MONSTER / VEHICLE: -1 to hit unless using [CLOSE-QUARTERS] weapon vs engaged target. [BLAST] weapons cannot target engaged units."
    - type: paragraph
      html: "<b>Indirect:</b> Unengaged, did not advance, has at least one [INDIRECT FIRE] weapon. (10.07)"

    - type: subsection
      title: "Targeting Rules"
    - type: list
      items:
        - html: "<b>Normal/Assault</b>: target visible, within range, unengaged."
        - html: "<b>Indirect</b>: target need not be visible; target has BoC; cannot re-roll hits; unmodified 1-5 fails (1-3 if unit remained stationary and target visible to a friendly unit)."
        - "Engaged MONSTER / VEHICLE units can be target; -1 to hit."
        - "Different weapons on the same model may target different units; one weapon cannot be split across targets."

    - type: subsection
      title: "Attack Sequence"
    - type: keyvals
      items:
        - label: "1. Hit Roll (05.01)"
          text: "D6 ≥ BS/WS. Unmodified 1 always fails, unmodified 6 is a Critical Hit."
        - label: "2. Wound Roll (05.02)"
          text: "D6 vs belows table. Unmodified 1 always fails, unmodified 6 is a Critical Wound."
        - label: "3. Wound Allocation (see below)"
          text: ""
        - label: "4. Save Roll (05.04)"
          text: "D6 - AP vs Sv or D6 vs InSv. Unmodified 1 always inflicts damage."
        - label: "5. Damage (05.04)"
          text: "Model loses wounds = D. Excess damage lost."
    - type: table
      header: "Wound Roll Table"
      columns: ["S vs T", "Need"]
      rows:
        - ["S ≥ 2xT", "2+"]
        - ["S > T", "3+"]
        - ["S = T", "4+"]
        - ["S < T", "5+"]
        - ["S ≤ ½T", "6+"]

    - type: subsection
      title: "Wound Allocation (05.03)"
    - type: paragraph
      html: "<b>Groups:</b> One per CHARACTER; one per matching W/Sv/InSv set of non-CHARACTERs."
    - type: paragraph
      html: "<b>Order:</b> Wounded non-CHARACTER → unwounded non-CHARACTER → CHARACTER (last)."
    - type: callout
      variant: "warn"
      text: "No CHARACTER group may be allocated before any non-CHARACTER group. Once all non-CHARACTERs are gone, wounds reach CHARACTERs normally (no blanket immunity)."
    - type: callout
      variant: "warn"
      text: "Work through saves lowest to highest. Select model with lost wounds first within a group."

    - type: subsection
      title: "Benefit of Cover (BoC) (13.08)"
    - type: list
      items:
        - html: "Worsen attacker's BS by 1 if <b>every</b> model in the target unit is INFANTRY / BEASTS / SWARM within a terrain area OR not fully visible due to intervening terrain/obscuring area."

    - type: subsection
      title: "Mortal Wounds (06.02)"
    - type: list
      items:
        - '1 MW = 1 wound lost, no saves. Inflicted after all normal damage from the same attack (see Wound Allocation). "Feel no Pain" rolls can still be made.'

    - type: subsection
      title: "Hazard Rolls (06.03)"
    - type: list
      items:
        - "Roll a D6: 1-2 suffers 1 MW (or 3 MW if MONSTER / VEHICLE)"

    - type: subsection
      title: "Objectives"
    - type: list
      items:
        - "Terrain objective: objective = the terrain area itself; within range = wholly within that area."
        - 'Objective marker: within range = within 3" horizontally and 5" vertically.'
        - "Level of Control (LOC): total OC of all your models within range."
        - "Higher LOC controls; equal LOC = contested. Assessed at end of each phase and turn."
        - "Secured objective: remain controlled even with no models in range, until opponent's LOC exceeds yours at end of a phase."

    # ================= PAGE 2 =================
    - type: page_break
    - type: subphase
      title: "ACTIONS"
    - type: paragraph
      html: "<b>A unit cannot start an action if: (16.01)</b>"
    - type: list
      items:
        - "Not on the battlefield."
        - "AIRCRAFT or FORTIFICATION unit."
        - "Battle-shocked."
        - "OC = 0 or -."
        - "Engaged (unless TITANIC)."
        - "Made an advance or fall-back move this turn."
        - "Already started another action this turn."
    - type: paragraph
      html: "<b>Starting an action:</b> unit is not eligible to shoot (exc. TITANIC) or declare a charge until action ends or turn ends."
    - type: paragraph
      html: "<b>Fails to complete if:</b> unit makes any move (exc. pile-in/consolidation) or leaves the battlefield"

    - type: subphase
      title: "TERRAIN"
    - type: subsection
      title: "Movement by Category (13.06)"
    - type: paragraph
      html: "<b>Exposed (13.03) &amp; Light (13.04):</b> All models can move freely horizontally and vertically through these terrains."
    - type: paragraph
      html: "<b>Dense (13.05):</b>"
    - type: list
      items:
        - "INFANTRY / BEASTS / SWARM / MOBILE can move horizontally freely"
        - "INFANTRY / BEASTS / SWARM can move vertically freely"
        - 'All others move horizontal through sections ≤ 2" height only; climb vertically through taller sections.'
        - "Cannot end on elevated surface unless all models are INFANTRY / BEASTS / SWARM / FLY / MONSTER and no part of the base overhangs outer edge."
    - type: subsection
      title: "Visibility (13.07)"
    - type: paragraph
      html: '<b>Solid (dense terrain):</b> LOS cannot cross enclosed gaps ≤ 3" from ground level. (13.11)'
    - type: paragraph
      html: "<b>Obscuring terrain area:</b> If every LOS between two models crosses an obscuring area (neither model in it), they cannot see each other. (13.10)"
    - type: paragraph
      html: '<b>Hidden:</b> INFANTRY / BEASTS / SWARM inside dense area, no ranged attacks this turn. Only visible within 15". (13.09)'
    - type: paragraph
      html: '<b>Plunging Fire:</b> +1 BS if attacker is on terrain ≥ 3" high, or has TOWERING and target is within 12". (22.05)'

    - type: phase
      title: "4. CHARGE PHASE (11)"
    - type: paragraph
      html: 'Targets must be within 12" (need not be visible) and not engaged. (11.02)'
    - type: paragraph
      html: "<b>Charge Roll:</b> 2D6 = max distance of charge move. (11.02)"
    - type: paragraph
      html: "<b>Charge move conditions: (11.02)</b>"
    - type: list
      items:
        - "Select charge targets before moving."
        - 'Each model must move closer to a charge target; within 1" if possible; engaged if possible.'
        - html: "Must end engaged with <b>all</b> charge targets; cannot end engaged with non-targets."
        - "Each model in charging unit gains FIGHTS FIRST."

    - type: phase
      title: "5. FIGHT PHASE (12)"
    - type: subsection
      title: "Pile In - <u>both</u> players; active player first (12.03)"
    - type: list
      items:
        - 'Up to 3" if engaged OR made charge move OR was selected for overrun fight. (12.06)'
        - 'Select targets first: every engaged enemy unit (if engaged); or ≥1 enemy unit within 5" (if not).'
        - "Models in base contact cannot move. Each model moved must end closer to closest target, engaged if possible."
        - "Must end engaged. Each model that started engaged must remain engaged."
    - type: subsection
      title: "Fight - <u>both</u> players; active player first (12.04)"
    - type: paragraph
      html: "<b>Eligible:</b> Engaged at start of Fight step or made charge move"
    - type: paragraph
      html: "<b>1. Fights First:</b> Alternate selections, active player starts."
    - type: paragraph
      html: "<b>2. Remaining Combats:</b> Start with the player who moved this sequence onto this step, alternate selections"
    - type: paragraph
      html: "<b>Fight Types:</b>"
    - type: list
      items:
        - html: "<b>Normal Fight:</b> Unit is engaged. (12.05)"
        - html: "<b>Overrun Fight:</b> Unit is unengaged (or was at start of step). One extra pile-in move, then fights. (12.06)"
    - type: paragraph
      text: 'If a new Fights First becomes eligible while resolving Remaining Combats, return to Fights First step. When all eligible units are more than 5" from all enemy units, player may pass.'
    - type: subsection
      title: "Consolidate - <u>both</u> players; active player first (12.08)"
    - type: list
      items:
        - 'Up to 3" if the unit was eligible to fight this phase.'
    - type: paragraph
      html: "<b>Select mode (first applicable):</b>"
    - type: list
      items:
        - html: "<b>Ongoing:</b> Unit engaged, remains engaged; move closer to enemies, do <u>not</u> move if in base contact."
        - html: '<b>Engaging:</b> Within 3" of enemies. Must end engaged if possible; newly engaged enemy units that have not fought must fight next.'
        - html: '<b>Objective:</b> Within 3" of objective. Must end within range of it if possible.'

    # ================= PAGE 3 - DATASHEET CHARACTERISTICS =================
    - type: page_break
    # ---- Core Abilities glossary (full-width) ----
    - type: column_reset
    - type: glossary
      title: "CORE ABILITIES"
      spanning: yes
      terms:
        - {
            term: "[ANTI-X Y+] (24.03)",
            text: "Unmodified wound roll of Y+ = Critical Wound vs keyword X.",
          }
        - { term: "[ASSAULT] (24.04)", text: "Enables Assault Shooting." }
        - {
            term: "[BLAST X] (24.05)",
            text: "+X attack dice per 5 models in target unit (round down). X=1 if no X value is given.",
          }
        - {
            term: "[CLEAVE X] (24.06)",
            text: "+X attack dice per 5 models in target unit (round down).",
          }
        - {
            term: "[CLOSE-QUARTERS] (24.07)",
            text: "Enables Close-Quarters Shooting (old: [PISTOL]).",
          }
        - {
            term: "DEADLY DEMISE X (24.08)",
            text: 'On destruction, roll D6; on 6, units within 6" suffer X MW (if random X, roll per unit).',
          }
        - {
            term: "DEEP STRIKE (24.09)",
            html: 'Ingress move can be anywhere &gt; 8" from enemies, including opponent''s deployment zone.',
          }
        - {
            term: "[DEVASTATING WOUNDS] (24.10)",
            html: "Critical Wound → attack ends; target suffers MW = D characteristic. Max 1 model per Critical Wound; excess MW lost.",
          }
        - {
            term: "[EXTRA ATTACKS] (24.11)",
            text: "When fighting: must use all [EXTRA ATTACKS] weapons plus one other melee weapon.",
          }
        - {
            term: "FEEL NO PAIN X+ (24.12)",
            text: "Each time model would lose a wound (including MW), roll D6; on X+, wound not lost.",
          }
        - {
            term: "FIGHTS FIRST (24.13)",
            text: "Every model must have this; unit fights in Fights First step.",
          }
        - {
            term: "FIRING DECK X (24.14)",
            text: "Select up to X embarked models; TRANSPORT gains their ranged weapons this phase. Those units cannot shoot.",
          }
        - {
            term: "[HAZARDOUS] (24.15)",
            text: "One hazard roll per [HAZARDOUS] weapon used.",
          }
        - {
            term: "HEAVY (24.16)",
            text: '+1 to hit if unengaged, not set up this turn, moved ≤ 3".',
          }
        - {
            term: "HOVER (24.17)",
            text: 'Taking to skies: do not subtract 2" from max distance.',
          }
        - {
            term: "[IGNORES COVER] (24.18)",
            text: "Target cannot have BoC against this attack.",
          }
        - {
            term: "[INDIRECT FIRE] (24.19)",
            text: "Enables Indirect Shooting.",
          }
        - {
            term: "INFILTRATORS (24.20)",
            html: 'Deploy &gt; 8" from opponent''s deployment zone and all enemies.',
          }
        - {
            term: "[LANCE] (24.21)",
            text: "+1 to wound if unit made a charge move this turn.",
          }
        - {
            term: "LEADER / SUPPORT (24.22)",
            html: "Leader and Support each attach to one bodyguard unit (one Leader + one Support max per bodyguard). Bodyguard's T used for wound rolls. See Wound Allocation for CHARACTER protection rules.",
          }
        - {
            term: "[LETHAL HITS] (24.23)",
            html: "Critical Hit → may auto-wound (no wound roll; cannot result in Critical Wound).",
          }
        - {
            term: "LONE OPERATIVE (24.24)",
            text: 'Not visible beyond 12". Cannot be targeted by [INDIRECT FIRE] beyond 12".',
          }
        - {
            term: "[MELTA X] (24.25)",
            text: "If target within half range at Select Targets, add X to D.",
          }
        - {
            term: "[ONE SHOT] (24.26)",
            text: "Once per battle. Revived models cannot re-use it.",
          }
        - {
            term: "[PISTOL] (24.27)",
            text: "Same as [CLOSE-QUARTERS], see [CLOSE-QUARTERS].",
          }
        - {
            term: "[PRECISION] (24.28)",
            text: "May select a visible CHARACTER allocation group as current allocation group.",
          }
        - {
            term: "[PSYCHIC] (24.29)",
            text: "May ignore modifiers to BS/WS and to the Hit Roll. Counts as psychic attack.",
          }
        - {
            term: "[RAPID FIRE X] (24.30)",
            text: "+X attack dice if target within half range when selected.",
          }
        - {
            term: 'SCOUTS X" (24.31)',
            html: 'Pre-battle: Scout move (24.32) up to X" (must end &gt;8" from enemies) OR redeploy from reserves into deployment zone.',
          }
        - {
            term: "STEALTH (24.33)",
            text: "If every model has this: unit BoC against all ranged attacks.",
          }
        - {
            term: "SUPER-HEAVY WALKER (24.35)",
            text: 'Move through models (not TITANIC); horizontal through terrain ≤ 4" high. May grant MOBILE for the move (on 1 after move ends: battle-shocked).',
          }
        - {
            term: "[SUSTAINED HITS X] (24.36)",
            text: "Critical Hit = X additional hits.",
          }
        - { term: "[TORRENT] (24.37)", text: "Automatically hits." }
        - { term: "[TWIN-LINKED] (24.38)", text: "Re-roll wound roll." }

    - type: glossary
      title: "DATASHEET CHARACTERISTICS"
      spanning: yes
      terms:
        - {
            term: "M",
            text: "Movement - distance the unit can move (Normal Move/Advance).",
          }
        - { term: "T", text: "Toughness - used in the Wound Roll (S vs T)." }
        - {
            term: "Sv / InSv",
            text: "Save - armour save characteristic, used in the Save Roll. An invulnerable save (InSv) works the same way but ignores AP.",
          }
        - { term: "W", text: "Wounds - how many wounds the model has." }
        - { term: "Ld", text: "Leadership - target for the Battle-Shock Test." }
        - {
            term: "OC",
            text: "Objective Control - contribution to controlling an objective.",
          }
        - { term: "R", text: "Range - maximum distance a weapon can target." }
        - { term: "A", text: "Attacks - number of attacks a weapon makes." }
        - {
            term: "BS",
            text: "Ballistic Skill - Hit Roll characteristic for ranged attacks.",
          }
        - {
            term: "WS",
            text: "Weapon Skill - Hit Roll characteristic for melee attacks.",
          }
        - { term: "S", text: "Strength - used in the Wound Roll (S vs T)." }
        - {
            term: "AP",
            text: "Armour Penetration - worsens the target's Save Roll.",
          }
        - {
            term: "D",
            text: "Damage - wounds lost by the target in the Damage step.",
          }

    # ================= PAGE 4 - STRATAGEMS =================
    - type: page_break
    - type: spanning_headline
      title: "STRATAGEMS"

    - type: stratagem
      title: "Command Re-roll (15.02)"
      cost: "1CP"
      timing: "either"
      when: "Any phase, just after making an Advance roll, Charge roll, Damage roll, Hazard roll, Hit roll, Save roll, Wound roll, or a roll to determine the number of attacks generated with a weapon, for a friendly unit or model."
      target: "That unit or model."
      effect: "Re-roll that roll. If rolling more than one dice together, select one dice to re-roll. Charge rolls must be re-rolled in full."

    - type: stratagem
      title: "Epic Challenge (15.03)"
      cost: "1CP"
      timing: "either"
      when: "Fight phase, just after a friendly CHARACTER unit is selected to fight."
      target: "That CHARACTER unit."
      effect: "Select one CHARACTER model in your unit. Until end of phase, that model's melee weapons have [PRECISION]."

    - type: stratagem
      title: "Insane Bravery (15.04)"
      cost: "1CP"
      timing: "your"
      when: "Battle-shock step of your Command phase, just before making a battle-shock roll for a friendly unit."
      target: "That unit."
      effect: "That battle-shock roll automatically succeeds."
      restrictions: "Once per battle."

    - type: stratagem
      title: "Explosives (15.05)"
      cost: "1CP"
      timing: "your"
      when: "Your Shooting phase."
      target: "One friendly unengaged EXPLOSIVES/GRENADES unit eligible to shoot that did not advance this turn."
      effect: 'Select one EXPLOSIVES/GRENADES model and one unengaged enemy unit within 8" and visible to it. Roll six D6: for each 4+, that enemy unit suffers 1 mortal wound.'

    - type: stratagem
      title: "Crushing Impact (15.06)"
      cost: "1CP"
      timing: "your"
      when: "Your Charge phase, just after a friendly MONSTER/VEHICLE unit ends a charge move."
      target: "That MONSTER/VEHICLE unit."
      effect: "Select one engaged enemy unit and one model in your unit engaged with it. Roll D6s equal to that model's T: each 1 = your unit suffers 1 MW; each 5+ = enemy suffers 1 MW (max 6 MW)."

    - type: stratagem
      title: "Rapid Ingress (15.07)"
      cost: "1CP"
      timing: "opponent"
      when: "End of your opponent's Movement phase."
      target: "One friendly unit in strategic reserves (excluding AIRCRAFT)."
      effect: "Your unit makes an ingress move."
      restrictions: "Cannot be used during the first battle round."

    - type: stratagem
      title: "Fire Overwatch (15.08)"
      cost: "1CP"
      timing: "opponent"
      when: "End of your opponent's Movement phase."
      target: "One friendly unengaged unit (excluding TITANIC)."
      effect: 'Your unit uses snap shooting - target one visible enemy unit within 24"; hits only on unmodified 6; cannot re-roll hit rolls. Unit cannot start an action until end of phase.'

    - type: stratagem
      title: "Smokescreen (15.10)"
      cost: "1CP"
      timing: "opponent"
      when: "Start of your opponent's Shooting phase."
      target: "One friendly SMOKE unit."
      effect: "Until end of phase, each time an attack targets your SMOKE unit, or a unit not fully visible to the attacker due to your SMOKE unit, that target has Benefit of Cover."

    - type: stratagem
      title: "Heroic Intervention (15.11)"
      cost: "1CP / 2CP"
      timing: "opponent"
      when: "End of your opponent's Charge phase."
      target: 'One friendly unengaged unit within 12" of one or more enemy units. VEHICLE only if CHARACTER/WALKER.'
      effect_html: 'Resolve a charge. Select mode before charge roll:<ul><li><b>Leap to Defend (1CP):</b> charge targets must be units that made a charge move this phase and are within max distance.</li><li><b>Into the Fray (2CP):</b> charge roll result &gt;6 becomes 6; charge targets can be any enemy within 6" and within max distance.</li></ul>'

    - type: stratagem
      title: "Counteroffensive"
      cost: "2CP"
      timing: "opponent"
      when: "Fight step of your opponent's Fight phase, just after an enemy unit has resolved its attacks."
      target: "One friendly unit eligible to fight."
      effect: "Until end of phase, your unit has Fights First and must be the next unit selected to fight."

    - type: column_reset

    - type: spanning_headline
      title: "USING STRATAGEMS"
    - type: list
      single_column: yes
      items:
        - "To use: select targets → reduce CP by the stratagem's cost → resolve effect. Cannot use if insufficient CP."
        - "Cannot use the same stratagem more than once in the same phase."
        - "Unless otherwise stated, cannot target the same unit with more than one stratagem in the same phase."
        - "If a stratagem has an additional cost section (e.g. +1CP), it can only be used by paying that extra cost."
