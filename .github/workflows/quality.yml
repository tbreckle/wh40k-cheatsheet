name: quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ["feature/**", "develop", "release/**", "hotfix/**", "main"]

jobs:
  validate-version:
    # On a `pull_request` (release/hotfix branch opened against develop/main), only verify —
    # the push below already fixed the branch itself, so a mismatch here would mean something
    # bypassed that automation. On a `push` directly to the branch, auto-fix instead of failing:
    # rewrite pyproject.toml to the branch's own version, re-lock, and commit+push the result, so
    # a maintainer never hand-edits either file when cutting a release. See spec.md's 2026-09-14
    # amendment and contracts/ci-workflow.md.
    if: startsWith(github.head_ref || github.ref_name, 'release/') || startsWith(github.head_ref || github.ref_name, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-suffix: ${{ github.job }}

      - name: Sync environment
        run: uv sync --locked

      - name: Validate branch version against pyproject.toml (pull requests)
        if: github.event_name == 'pull_request'
        run: uv run wh40k-cheatsheet validate-version "${{ github.head_ref }}"

      - name: Bump pyproject.toml to the branch's version (pushes)
        if: github.event_name == 'push'
        run: uv run wh40k-cheatsheet validate-version "${{ github.ref_name }}" --fix

      - name: Re-lock dependencies if the version changed
        if: github.event_name == 'push'
        run: git diff --quiet -- pyproject.toml || uv lock

      - name: Commit and push the version bump, if any
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- pyproject.toml uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml uv.lock
            git commit -m "chore: bump version to ${GITHUB_REF_NAME#*/} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libharfbuzz0b libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-suffix: ${{ github.job }}

      - name: Sync environment
        run: uv sync --locked

      # Split rather than a single `poe check` so a stalling gate is identifiable from the step
      # list alone, and so one slow gate can't consume the whole job's budget.
      - name: Gate — format
        timeout-minutes: 2
        run: uv run poe format-check

      - name: Gate — lint
        timeout-minutes: 5
        run: uv run poe lint

      - name: Gate — security
        timeout-minutes: 2
        run: uv run poe security

      - name: Gate — types
        timeout-minutes: 2
        run: uv run poe types

      - name: Gate — tests
        timeout-minutes: 10
        run: uv run pytest -v

  build:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libharfbuzz0b libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-suffix: ${{ github.job }}

      - name: Sync environment
        run: uv sync --locked

      - name: Build every declared edition/language
        run: uv run wh40k-cheatsheet package

      - name: Upload built PDFs
        uses: actions/upload-artifact@v7
        with:
          name: cheatsheet-pdfs
          path: dist/*.pdf

  publish-prerelease:
    # Every push directly to a release/*/hotfix/* branch (not a PR, not main) publishes/updates a
    # GitHub Release for that branch's version, always marked pre-release — so a maintainer can
    # inspect exactly what will ship, on the public Releases page, before merging into main.
    # Checking needs.check.result/needs.build.result explicitly (not bare `success()`) — see the
    # comment on publish-release below for why bare `success()` is unsafe here.
    if: needs.check.result == 'success' && needs.build.result == 'success' && github.event_name == 'push' && (startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'hotfix/'))
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Not github.sha: validate-version (a prerequisite of build, a prerequisite of this
          # job) may have just pushed a version-bump commit onto this same branch; checking out
          # the branch's current tip (rather than the pre-bump triggering commit) is what makes
          # `read_project_version` below see that bump instead of a stale version.
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-suffix: ${{ github.job }}

      - name: Sync environment
        run: uv sync --locked

      - name: Download built PDFs
        uses: actions/download-artifact@v8
        with:
          name: cheatsheet-pdfs
          path: dist

      - name: Compute release version
        id: version
        run: |
          uv run python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from wh40k_cheatsheet.versioning import read_project_version
          v = read_project_version(Path("."))
          print(f"version={v}")
          PYEOF

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pdf --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease
          else
            gh release create "$TAG" dist/*.pdf --title "$TAG" --target "$GITHUB_SHA" --prerelease \
              --notes "Pre-release build from \`${{ github.ref_name }}\`. Not yet merged into main."
          fi

  publish-release:
    # An explicit success condition is required here: providing a job's own `if:` replaces
    # GitHub Actions' implicit "all `needs:` succeeded" check entirely, rather than being ANDed
    # with it — without one, publish-release would run even if `check` or `build` failed,
    # violating FR-009. But bare `success()` is the WRONG explicit condition (2026-09-14 bug fix,
    # reported against a real main-branch run that stayed skipped despite check/build both
    # passing): `success()` evaluates across this job's ENTIRE transitive dependency chain, not
    # just its own `needs: [check, build]` — and `build` itself depends on `validate-version`,
    # which is *always* skipped on `main` by design (main is never a release/hotfix branch).
    # `success()` treats that skip as non-success and skips this job too, every single time,
    # regardless of whether check/build passed. Checking needs.check.result/needs.build.result
    # directly sidesteps validate-version entirely, since it isn't in this job's own `needs:`.
    if: needs.check.result == 'success' && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-suffix: ${{ github.job }}

      - name: Sync environment
        run: uv sync --locked

      - name: Download built PDFs
        uses: actions/download-artifact@v8
        with:
          name: cheatsheet-pdfs
          path: dist

      - name: Compute release version
        id: version
        run: |
          uv run python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from wh40k_cheatsheet.versioning import read_project_version, is_prerelease
          v = read_project_version(Path("."))
          print(f"version={v}")
          print(f"prerelease={'true' if is_prerelease(v) else 'false'}")
          PYEOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # A release for this tag may already exist and be marked pre-release, published by
          # publish-prerelease from a push to the release/hotfix branch that's now being merged —
          # `gh release edit` here promotes it (or re-affirms pre-release status, per FR-010).
          PRERELEASE_FLAG="--prerelease=false"
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.pdf --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" $PRERELEASE_FLAG
          else
            gh release create "$TAG" dist/*.pdf --title "$TAG" --target "$GITHUB_SHA" $PRERELEASE_FLAG
          fi
